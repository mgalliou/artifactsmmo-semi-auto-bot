[workspace]
resolver = "3"
members = [
  "crates/openapi",
  "crates/api",
  "crates/sdk",
  "crates/sdk_derive",
  "crates/bot",
  "crates/repl",
]
default-members = ["crates/repl"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
# member 
openapi = { path = "crates/openapi" }
api = { path = "crates/api" }
sdk = { path = "crates/sdk" }
sdk_derive = { path = "crates/sdk_derive" }
bot = { path = "crates/bot" }
repl = { path = "crates/repl" }

# external
anyhow = "1.0"
arc-swap = "1.9"
async-trait = "0.1"
bus = "2.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
derive_more = { version = "2.1", features = [
  "deref",
  "display",
  "from",
  "try_from",
] }
downcast-rs = "2.0"
dyn-clone = "1.0"
figment = { version = "0.10", features = ["toml"] }
governor = "0.10"
http = "1.4"
itertools = "0.15"
log = "0.4"
ordered-float = "5.3"
quote = "1.0"
rand = "0.10"
rayon = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "query",
  "form",
] }
reqwest-middleware = { version = "0.5", features = [
  "json",
  "multipart",
  "query",
  "form",
] }
ron = "0.12"
rustyline = "18.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_repr = "0.1"
serde_with = { version = "3.21", default-features = false, features = [
  "base64",
  "std",
  "macros",
] }
simple-logging = "2.0"
strum = "0.28"
strum_macros = "0.28"
syn = "3.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
url = "2.5"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = { level = "allow" }
missing_errors_doc = { level = "allow" }
cast_possible_truncation = { level = "allow" }
cast_sign_loss = { level = "allow" }
cast_possible_wrap = { level = "allow" }
cast_precision_loss = { level = "allow" }
multiple_crate_versions = { level = "allow" }
